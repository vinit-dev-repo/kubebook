apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch15-shared
spec:
  nodeName: kubebook-ch15-worker
  volumes:
    - name: shared
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.37
      command: ["sh", "-c", "rm -f /data/stop; i=0; while [ ! -f /data/stop ]; do i=$((i+1)); echo \"line $i\" >> /data/log; sleep 1; done; exit 1"]
      volumeMounts:
        - name: shared
          mountPath: /data
    - name: reader
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: shared
          mountPath: /shared
    - name: viewer
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: shared
          mountPath: /view
          readOnly: true
