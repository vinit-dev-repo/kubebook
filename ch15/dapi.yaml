apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch15-dapi
  labels:
    app: kubebook-ch15
    tier: web
  annotations:
    kubebook/owner: "team a"
spec:
  volumes:
    - name: podinfo
      downwardAPI:
        items:
          - path: name
            fieldRef:
              fieldPath: metadata.name
          - path: namespace
            fieldRef:
              fieldPath: metadata.namespace
          - path: uid
            fieldRef:
              fieldPath: metadata.uid
          - path: labels
            fieldRef:
              fieldPath: metadata.labels
          - path: annotations
            fieldRef:
              fieldPath: metadata.annotations
          - path: cpu_limit
            resourceFieldRef:
              containerName: app
              resource: limits.cpu
              divisor: 1m
          - path: mem_request
            resourceFieldRef:
              containerName: app
              resource: requests.memory
              divisor: 1Mi
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      env:
        - name: TIER
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tier']
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 64Mi
      volumeMounts:
        - name: podinfo
          mountPath: /etc/podinfo
