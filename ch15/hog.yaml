apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch15-hog
spec:
  restartPolicy: Never
  volumes:
    - name: cache
      emptyDir:
        medium: Memory
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "dd if=/dev/zero of=/cache/big bs=1M count=64; echo done; sleep 30"]
      resources:
        limits:
          memory: 32Mi
      volumeMounts:
        - name: cache
          mountPath: /cache
