apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch15-secret-group
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  containers:
  - name: app
    image: busybox:1.37
    imagePullPolicy: Never
    command: ["sleep", "3600"]
    volumeMounts:
    - name: protected
      mountPath: /run/demo
      readOnly: true
  volumes:
  - name: protected
    secret:
      secretName: kubebook-ch15-mode-secret
      defaultMode: 0640
