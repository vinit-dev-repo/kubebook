apiVersion: v1
kind: Pod
metadata:
  name: geph
  namespace: kubebook-ch15-ex
spec:
  volumes:
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Mi
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
