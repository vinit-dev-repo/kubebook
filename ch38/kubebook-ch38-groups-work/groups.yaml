apiVersion: v1
kind: Pod
metadata: {name: group-merge}
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    supplementalGroupsPolicy: Merge
  volumes: [{name: data, emptyDir: {}}]
  initContainers:
  - name: prepare
    image: busybox:1.37
    command: [sh, -c, 'echo shared-note > /data/note; chown 0:50000 /data/note; chmod 0640 /data/note']
    securityContext: {runAsUser: 0, runAsGroup: 0}
    volumeMounts: [{name: data, mountPath: /data}]
  containers:
  - name: reader
    image: kubebook-ch38-groups:v1
    imagePullPolicy: Never
    command: [sleep, '3600']
    volumeMounts: [{name: data, mountPath: /data}]
---
apiVersion: v1
kind: Pod
metadata: {name: group-strict}
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    supplementalGroupsPolicy: Strict
  volumes: [{name: data, emptyDir: {}}]
  initContainers:
  - name: prepare
    image: busybox:1.37
    command: [sh, -c, 'echo shared-note > /data/note; chown 0:50000 /data/note; chmod 0640 /data/note']
    securityContext: {runAsUser: 0, runAsGroup: 0}
    volumeMounts: [{name: data, mountPath: /data}]
  containers:
  - name: reader
    image: kubebook-ch38-groups:v1
    imagePullPolicy: Never
    command: [sleep, '3600']
    volumeMounts: [{name: data, mountPath: /data}]
