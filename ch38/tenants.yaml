apiVersion: v1
kind: Namespace
metadata:
  name: kubebook-ch38-team-a
  labels:
    tenant: team-a
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubebook-ch38-team-b
  labels:
    tenant: team-b
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-a-edit
  namespace: kubebook-ch38-team-a
subjects:
  - kind: User
    name: alice
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: kubebook-ch38-team-a
spec:
  hard:
    pods: "2"
