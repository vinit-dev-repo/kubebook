name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Build and push with the commit tag
        run: |
          TAG=$(git rev-parse --short HEAD)
          IMAGE="us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/kubebook-ch45/client:$TAG"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" client
          docker push "$IMAGE"
      - name: Point the Deployment at the new image
        run: |
          gcloud container clusters get-credentials kubebook-ch45 --region us-central1 --project "${{ vars.GCP_PROJECT }}"
          kubectl -n kubebook-ch45 set image deployment/kubebook-ch21-web web="$IMAGE"
          kubectl -n kubebook-ch45 rollout status deployment/kubebook-ch21-web --timeout=300s
