apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-probes
  labels:
    app: probes
spec:
  containers:
    - name: web
      image: nginx:1.28-alpine
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 1
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 2
      livenessProbe:
        tcpSocket:
          port: 80
        periodSeconds: 5
    - name: side
      image: busybox:1.37
      command: ["sh", "-c", "touch /tmp/healthy; sleep 3600"]
      livenessProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        initialDelaySeconds: 2
        periodSeconds: 3
