apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-start-held
  namespace: default
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 2
  automountServiceAccountToken: false
  containers:
    - name: worker
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          printf 'main process began\n'
          n=0
          while true; do
            n=$((n+1))
            printf '%s\n' "$n" > /counter.next
            mv /counter.next /counter
            sleep 1
          done
      lifecycle:
        postStart:
          exec:
            command:
              - sh
              - -c
              - |
                touch /hook-waiting
                for n in $(seq 1 300); do
                  if test -f /release-hook; then exit 0; fi
                  sleep 1
                done
                exit 1
