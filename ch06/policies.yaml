apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-rp-always
spec:
  containers:
    - name: s
      image: busybox:1.37
      command: ["sh", "-c", "echo hi; exit 0"]
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-rp-onfailure
spec:
  restartPolicy: OnFailure
  containers:
    - name: s
      image: busybox:1.37
      command: ["sh", "-c", "echo hi; exit 0"]
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-rp-fail
spec:
  restartPolicy: OnFailure
  containers:
    - name: s
      image: busybox:1.37
      command: ["sh", "-c", "echo boom; exit 3"]
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-rp-never
spec:
  restartPolicy: Never
  containers:
    - name: s
      image: busybox:1.37
      command: ["sh", "-c", "echo boom; exit 3"]
