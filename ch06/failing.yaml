apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-live
spec:
  containers:
    - name: web
      image: nginx:1.28-alpine
      livenessProbe:
        httpGet:
          path: /missing
          port: 80
        periodSeconds: 2
        failureThreshold: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-ready
  labels:
    app: ready
spec:
  containers:
    - name: web
      image: nginx:1.28-alpine
      readinessProbe:
        httpGet:
          path: /missing
          port: 80
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch06-ready
spec:
  selector:
    app: ready
  ports:
    - port: 80
