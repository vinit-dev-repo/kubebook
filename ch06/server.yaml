apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch06-packet
  namespace: default
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 2
  containers:
    - name: web
      image: busybox:1.37
      command: ["sh", "-c", "mkdir -p /www; printf 'packet-evidence-only\n' > /www/packet-probe.txt; exec httpd -f -p 8080 -h /www"]
