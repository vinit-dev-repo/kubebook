- rule: Kubebook shell in the shells namespace
  desc: A shell started in a container of one namespace.
  condition: evt.type in (execve, execveat) and evt.dir=< and container.id != host and proc.name in (sh, bash) and k8s.ns.name = kubebook-ch42-shells
  output: "kubebook shell started (command=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)"
  priority: NOTICE
  tags: [kubebook]
