- list: kubebook_write_dirs
  items: [/etc]
- macro: kubebook_write_below_listed
  condition: (evt.type in (open, openat, openat2) and evt.is_open_write=true and fd.name pmatch (kubebook_write_dirs))
- rule: Kubebook write below etc in a container
  desc: A process in a container wrote a file below /etc.
  condition: kubebook_write_below_listed and container.id != host
  output: "kubebook write below etc (file=%fd.name command=%proc.cmdline container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)"
  priority: WARNING
  tags: [kubebook]
- rule: Kubebook read of dev mem
  desc: A process opened /dev/mem.
  condition: evt.type in (open, openat, openat2) and fd.name = /dev/mem
  output: "kubebook dev mem opened (command=%proc.cmdline container=%container.name pod=%k8s.pod.name)"
  priority: CRITICAL
  tags: [kubebook]
