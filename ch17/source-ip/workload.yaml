apiVersion: v1
kind: Pod
metadata:
  name: source-receipt
  namespace: kubebook-ch17-source-ip
  labels:
    app: source-receipt
spec:
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch17-worker
  terminationGracePeriodSeconds: 1
  containers:
    - name: receipt
      image: nginx:1.28-alpine
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /ready
          port: 8080
      volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: receipt-config
---
apiVersion: v1
kind: Service
metadata:
  name: source-receipt
  namespace: kubebook-ch17-source-ip
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: source-receipt
  ports:
    - port: 8080
      targetPort: 8080
