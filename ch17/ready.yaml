apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch17-ready
  labels:
    app: kubebook-ch17-web
spec:
  volumes:
    - name: html
      emptyDir: {}
  initContainers:
    - name: write
      image: busybox:1.37
      command: ["sh", "-c", "echo \"kubebook-ch17-ready on $NODE_NAME\" > /html/index.html"]
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: html
          mountPath: /html
  containers:
    - name: web
      image: nginx:1.28-alpine
      ports:
        - name: http
          containerPort: 80
      readinessProbe:
        exec:
          command: ["cat", "/tmp/ready"]
        periodSeconds: 2
      lifecycle:
        preStop:
          sleep:
            seconds: 8
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
