apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch17-nosel
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kubebook-ch17-nosel-1
  labels:
    kubernetes.io/service-name: kubebook-ch17-nosel
    endpointslice.kubernetes.io/managed-by: kubebook
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - "$API_IP"
