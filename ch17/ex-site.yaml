apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: kubebook-ch17-ex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: site
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: kubebook-ch17-ex
spec:
  selector:
    app: site
  ports:
    - port: 80
      targetPort: http
