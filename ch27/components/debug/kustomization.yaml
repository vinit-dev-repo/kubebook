apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
commonAnnotations:
  debug: "on"
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        template:
          spec:
            containers:
              - name: web
                env:
                  - name: DEBUG
                    value: "1"
