apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
replacements:
  - source:
      kind: ConfigMap
      name: web-config
      fieldPath: data.STYLE
    targets:
      - select:
          kind: Deployment
          name: web
        fieldPaths:
          - spec.template.spec.containers.[name=web].env.[name=GREETING].value
