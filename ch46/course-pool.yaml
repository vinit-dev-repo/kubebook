apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: course-pool
spec:
  template:
    metadata:
      labels:
        kubebook: custom-pool
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: course-storage
      taints:
      - key: kubebook
        value: custom-pool
        effect: NoSchedule
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: [amd64]
      - key: karpenter.sh/capacity-type
        operator: In
        values: [on-demand]
      - key: node.kubernetes.io/instance-type
        operator: In
        values: [m6i.large, m7i.large]
  limits:
    cpu: "2"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
