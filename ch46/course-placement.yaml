apiVersion: v1
kind: Pod
metadata:
  name: placement
  namespace: course-custom-pool
spec:
  nodeSelector:
    karpenter.sh/nodepool: course-pool
  tolerations:
  - key: kubebook
    operator: Equal
    value: custom-pool
    effect: NoSchedule
  containers:
  - name: proof
    image: busybox:1.37
    command: ["sh", "-c", "printf 'custom pool workload ready\\n'; sleep 3600"]
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 64Mi
