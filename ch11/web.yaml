apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch11-web
spec:
  clusterIP: None
  selector:
    app: kubebook-ch11-web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubebook-ch11-web
spec:
  serviceName: kubebook-ch11-web
  replicas: 3
  selector:
    matchLabels:
      app: kubebook-ch11-web
  template:
    metadata:
      labels:
        app: kubebook-ch11-web
    spec:
      initContainers:
        - name: mark
          image: busybox:1.37
          command: ["sh", "-c", "echo \"$(hostname) started\" >> /work/index.html"]
          volumeMounts:
            - name: www
              mountPath: /work
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
