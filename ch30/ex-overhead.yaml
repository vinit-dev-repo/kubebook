apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kubebook-ch30-ex-vm
handler: test-handler
overhead:
  podFixed:
    cpu: 50m
    memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch30-ex-vm
spec:
  runtimeClassName: kubebook-ch30-ex-vm
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      resources:
        limits:
          cpu: 100m
          memory: 32Mi
