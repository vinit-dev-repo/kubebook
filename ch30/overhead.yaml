apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kubebook-ch30-heavy
handler: test-handler
overhead:
  podFixed:
    cpu: 100m
    memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch30-oh
spec:
  runtimeClassName: kubebook-ch30-heavy
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 200m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 64Mi
