apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch16-ex-pod7
  namespace: kubebook-ch16-ex
spec:
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: kubebook-ch16-ex-move
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo kept across the move >> /data/note.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
