apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubebook-ch16-rwop
spec:
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch16-rwopuser
spec:
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch16-worker
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: kubebook-ch16-rwop
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
