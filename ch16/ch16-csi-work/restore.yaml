apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: restored, namespace: csi-ch16-lab}
spec:
  storageClassName: csi-hostpath-sc
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 64Mi}
  dataSource:
    name: baseline
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
---
apiVersion: v1
kind: Pod
metadata: {name: reader, namespace: csi-ch16-lab}
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: busybox:1.37
    command: [sh, -c, 'sleep 36000']
    volumeMounts: [{name: data, mountPath: /data}]
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: restored}
