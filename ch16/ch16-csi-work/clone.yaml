apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: cloned, namespace: csi-ch16-lab}
spec:
  storageClassName: csi-hostpath-sc
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  resources:
    requests: {storage: 64Mi}
  dataSourceRef:
    kind: PersistentVolumeClaim
    name: source
---
apiVersion: v1
kind: Pod
metadata: {name: clone-reader, namespace: csi-ch16-lab}
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: busybox:1.37
    command: [sh, -c, 'sleep 36000']
    volumeMounts: [{name: data, mountPath: /data}]
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: cloned}
