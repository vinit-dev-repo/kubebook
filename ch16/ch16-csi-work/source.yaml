apiVersion: v1
kind: Namespace
metadata: {name: csi-ch16-lab}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: source, namespace: csi-ch16-lab}
spec:
  storageClassName: csi-hostpath-sc
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: writer, namespace: csi-ch16-lab}
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: busybox:1.37
    command: [sh, -c, 'sleep 36000']
    volumeMounts: [{name: data, mountPath: /data}]
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: source}
