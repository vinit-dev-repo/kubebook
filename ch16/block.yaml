apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: raw
spec:
  volumeMode: Block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: raw-user
spec:
  volumes:
    - name: disk
      persistentVolumeClaim:
        claimName: raw
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      volumeDevices:
        - name: disk
          devicePath: /dev/xvda
