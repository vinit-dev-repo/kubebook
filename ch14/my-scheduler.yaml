apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebook-ch14-scheduler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubebook-ch14-scheduler-as-kube-scheduler
subjects:
  - kind: ServiceAccount
    name: kubebook-ch14-scheduler
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: system:kube-scheduler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubebook-ch14-scheduler-as-volume-scheduler
subjects:
  - kind: ServiceAccount
    name: kubebook-ch14-scheduler
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: system:volume-scheduler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebook-ch14-scheduler-extension-apiserver-authentication-reader
  namespace: kube-system
roleRef:
  kind: Role
  name: extension-apiserver-authentication-reader
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: kubebook-ch14-scheduler
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubebook-ch14-scheduler-config
  namespace: kube-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: kubebook-ch14-scheduler
      - schedulerName: kubebook-ch14-scheduler-no-spread
        plugins:
          score:
            disabled:
              - name: NodeResourcesBalancedAllocation
              - name: PodTopologySpread
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch14-scheduler
  namespace: kube-system
  labels:
    component: kubebook-ch14-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      component: kubebook-ch14-scheduler
  template:
    metadata:
      labels:
        component: kubebook-ch14-scheduler
    spec:
      serviceAccountName: kubebook-ch14-scheduler
      containers:
        - name: kube-scheduler
          image: registry.k8s.io/kube-scheduler:v1.36.4
          command:
            - kube-scheduler
            - --config=/etc/kubernetes/scheduler-config.yaml
            - --v=2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubebook-ch14-scheduler-config
