apiVersion: v1
kind: Pod
metadata:
  name: ratio-check
  namespace: kubebook-ch14-ex
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: registry.k8s.io/kube-scheduler:v1.36.4
      command: ["kube-scheduler", "--config=/etc/kubernetes/scheduler-config.yaml", "--write-config-to=/dev/stdout"]
      volumeMounts:
        - name: config
          mountPath: /etc/kubernetes
  volumes:
    - name: config
      configMap:
        name: ratio
