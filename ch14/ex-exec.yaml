apiVersion: v1
kind: Pod
metadata:
  name: plain
  namespace: kubebook-ch14-ex
spec:
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch14-worker
  containers:
    - name: web
      image: nginx:1.28-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: patient
  namespace: kubebook-ch14-ex
spec:
  tolerations:
    - key: kubebook-ch14-maint
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 20
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch14-worker
  containers:
    - name: web
      image: nginx:1.28-alpine
