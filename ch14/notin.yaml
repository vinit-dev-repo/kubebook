apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch14-notin
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubebook-ch14-size
                operator: NotIn
                values: [large, medium]
  containers:
    - name: web
      image: nginx:1.28-alpine
