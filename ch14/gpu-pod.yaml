apiVersion: v1
kind: Pod
metadata:
  name: trainer
  namespace: kubebook-ch14-dra
spec:
  resourceClaims:
    - name: gpu
      resourceClaimName: one-gpu
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "env | grep '^GPU_DEVICE' | grep -v RESOURCE_CLAIM | sort; sleep 3600"]
      resources:
        claims:
          - name: gpu
