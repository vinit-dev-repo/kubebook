apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: own-gpu
  namespace: kubebook-ch14-dra
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
  namespace: kubebook-ch14-dra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workers
  template:
    metadata:
      labels:
        app: workers
    spec:
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: own-gpu
      containers:
        - name: app
          image: busybox:1.37
          command: ["sleep", "3600"]
          resources:
            claims:
              - name: gpu
