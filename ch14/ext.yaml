apiVersion: v1
kind: Pod
metadata:
  name: classic
  namespace: kubebook-ch14-dra
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "env | grep -E '^GPU_DEVICE_[0-9]+=' ; sleep 3600"]
      resources:
        limits:
          deviceclass.resource.kubernetes.io/gpu.example.com: 1
