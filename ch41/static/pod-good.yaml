apiVersion: v1
kind: Pod
metadata:
  name: kubebook-good
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        limits: {cpu: 100m, memory: 64Mi}
        requests: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
