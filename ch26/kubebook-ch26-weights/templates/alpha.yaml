apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-alpha
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "5"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: busybox:1.37
          command: ["sh", "-c", "sleep 2"]
