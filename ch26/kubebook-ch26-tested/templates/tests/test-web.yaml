apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-web
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["sh", "-c", "wget -q -O - http://{{ .Release.Name }}-web | grep -o '<title>.*</title>'"]
