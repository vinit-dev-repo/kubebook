{{- if .Values.fail }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-explode
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": hook-failed
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: busybox:1.37
          command: ["sh", "-c", "exit 1"]
{{- end }}
