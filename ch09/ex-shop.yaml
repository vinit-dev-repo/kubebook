apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: kubebook-ch09-ex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-pdb
  namespace: kubebook-ch09-ex
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: shop
