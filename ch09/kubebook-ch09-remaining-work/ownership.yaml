apiVersion: apps/v1
kind: Deployment
metadata:
  name: ownership
  namespace: ch09-remaining
spec:
  replicas: 2
  selector:
    matchLabels:
      lab.kubebook/role: ownership
  template:
    metadata:
      labels:
        lab.kubebook/role: ownership
    spec:
      containers:
      - name: app
        image: busybox:1.37
        imagePullPolicy: Never
        command: ["sh", "-c", "sleep 3600"]
