apiVersion: v1
kind: Pod
metadata:
  name: ping-default
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: ping-noraw
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        capabilities:
          drop: ["NET_RAW"]
---
apiVersion: v1
kind: Pod
metadata:
  name: ping-none
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
