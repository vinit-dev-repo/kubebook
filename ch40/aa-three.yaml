apiVersion: v1
kind: Pod
metadata:
  name: aa-runtime
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        appArmorProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata:
  name: aa-plain
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: aa-open
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        appArmorProfile:
          type: Unconfined
