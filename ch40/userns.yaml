apiVersion: v1
kind: Pod
metadata:
  name: userns
spec:
  hostUsers: false
  terminationGracePeriodSeconds: 1
  volumes:
    - name: data
      emptyDir: {}
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3601"]
      volumeMounts:
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Pod
metadata:
  name: userns-plain
spec:
  terminationGracePeriodSeconds: 1
  volumes:
    - name: data
      emptyDir: {}
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3602"]
      volumeMounts:
        - name: data
          mountPath: /data
