apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kubebook-missing
handler: kubebook-nothing
---
apiVersion: v1
kind: Pod
metadata:
  name: no-handler
spec:
  runtimeClassName: kubebook-missing
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
