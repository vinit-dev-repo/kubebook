apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: v1
kind: Pod
metadata:
  name: sandboxed
spec:
  runtimeClassName: gvisor
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: normal
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
