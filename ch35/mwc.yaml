apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kubebook-origin-default
webhooks:
  - name: origin-default.kubebook.example.com
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    reinvocationPolicy: Never
    clientConfig:
      service: {name: kubebook-webhook, namespace: default, path: /mutate, port: 443}
      caBundle: $CA
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kubebook-ch35-hooked
        kubebook-webhook: "on"
