apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubebook-no-secret
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [kubebook.example.com]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [greetings]
  validations:
    - expression: "!object.spec.message.contains('secret')"
      message: "a Greeting may not hold the word secret"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubebook-no-secret
spec:
  policyName: kubebook-no-secret
  validationActions: [Deny]
