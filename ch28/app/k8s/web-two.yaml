apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch28-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubebook-ch28-web
  template:
    metadata:
      labels:
        app: kubebook-ch28-web
    spec:
      containers:
        - name: web
          image: kubebook-ch28-web
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch28-web
spec:
  selector:
    app: kubebook-ch28-web
  ports:
    - port: 80
