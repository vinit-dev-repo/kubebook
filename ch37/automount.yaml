apiVersion: v1
kind: ServiceAccount
metadata:
  name: quiet
  namespace: kubebook-ch37-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: nomount
  namespace: kubebook-ch37-dev
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: quiet-default
  namespace: kubebook-ch37-dev
spec:
  serviceAccountName: quiet
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: quiet-override
  namespace: kubebook-ch37-dev
spec:
  serviceAccountName: quiet
  automountServiceAccountToken: true
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
