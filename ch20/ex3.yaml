apiVersion: v1
kind: ConfigMap
metadata:
  name: kubebook-ch20-ex-page
  namespace: kubebook-ch20-ex
data:
  index.html: |
    exercise page
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch20-ex-nginx
  namespace: kubebook-ch20-ex
spec:
  selector:
    matchLabels:
      app: kubebook-ch20-ex-nginx
  template:
    metadata:
      labels:
        app: kubebook-ch20-ex-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: kubebook-ch20-ex-page
