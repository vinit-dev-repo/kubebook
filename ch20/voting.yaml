apiVersion: v1
kind: Secret
metadata:
  name: kubebook-ch20-db
type: Opaque
stringData:
  POSTGRES_USER: votes
  POSTGRES_PASSWORD: kubebook-ch20-secret
  POSTGRES_DB: votes
  DATABASE_URL: postgres://votes:kubebook-ch20-secret@kubebook-ch20-db:5432/votes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubebook-ch20-db-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch20-redis
spec:
  selector:
    matchLabels:
      app: kubebook-ch20-redis
  template:
    metadata:
      labels:
        app: kubebook-ch20-redis
        tier: data
    spec:
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch20-redis
spec:
  selector:
    app: kubebook-ch20-redis
  ports:
    - port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch20-db
spec:
  selector:
    matchLabels:
      app: kubebook-ch20-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kubebook-ch20-db
        tier: data
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          envFrom:
            - secretRef:
                name: kubebook-ch20-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "votes"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubebook-ch20-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch20-db
spec:
  selector:
    app: kubebook-ch20-db
  ports:
    - port: 5432
      targetPort: pg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch20-vote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubebook-ch20-vote
  template:
    metadata:
      labels:
        app: kubebook-ch20-vote
        tier: web
    spec:
      containers:
        - name: vote
          image: kubebook-ch20-vote:1
          env:
            - name: REDIS_URL
              value: redis://kubebook-ch20-redis:6379
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch20-vote
spec:
  type: NodePort
  selector:
    app: kubebook-ch20-vote
  ports:
    - port: 80
      targetPort: http
      nodePort: 31000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch20-worker
spec:
  selector:
    matchLabels:
      app: kubebook-ch20-worker
  template:
    metadata:
      labels:
        app: kubebook-ch20-worker
        tier: worker
    spec:
      containers:
        - name: worker
          image: kubebook-ch20-worker:1
          env:
            - name: REDIS_URL
              value: redis://kubebook-ch20-redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubebook-ch20-db
                  key: DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch20-result
spec:
  selector:
    matchLabels:
      app: kubebook-ch20-result
  template:
    metadata:
      labels:
        app: kubebook-ch20-result
        tier: web
    spec:
      containers:
        - name: result
          image: kubebook-ch20-result:1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubebook-ch20-db
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch20-result
spec:
  type: NodePort
  selector:
    app: kubebook-ch20-result
  ports:
    - port: 80
      targetPort: http
      nodePort: 31001
