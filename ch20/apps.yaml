apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch20-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubebook-ch20-hello
  template:
    metadata:
      labels:
        app: kubebook-ch20-hello
    spec:
      containers:
        - name: hello
          image: kubebook-ch20-hello:1
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch20-hello
spec:
  selector:
    app: kubebook-ch20-hello
  ports:
    - port: 80
      targetPort: http
