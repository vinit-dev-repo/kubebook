apiVersion: v1
kind: Pod
metadata:
  name: net-a
spec:
  nodeName: kubebook-ch31-control-plane
  tolerations:
    - operator: Exists
  containers:
    - name: c
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: net-b
  labels:
    app: kubebook-ch31-web
spec:
  nodeName: kubebook-ch31-worker
  containers:
    - name: web
      image: nginx:1.28-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: net-svc
spec:
  selector:
    app: kubebook-ch31-web
  ports:
    - port: 80
