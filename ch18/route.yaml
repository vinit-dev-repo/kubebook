apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubebook-ch18-route
spec:
  parentRefs:
    - name: kubebook-ch18-gw
  hostnames:
    - web.kubebook.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v2
      backendRefs:
        - name: kubebook-ch18-api
          port: 80
    - matches:
        - path:
            type: Exact
            value: /exact
      backendRefs:
        - name: kubebook-ch18-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /items
          method: POST
      backendRefs:
        - name: kubebook-ch18-api
          port: 80
    - matches:
        - queryParams:
            - name: debug
              value: "1"
      backendRefs:
        - name: kubebook-ch18-api
          port: 80
    - matches:
        - headers:
            - name: X-Debug
              value: "on"
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Env
                value: staging
      backendRefs:
        - name: kubebook-ch18-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /split
      backendRefs:
        - name: kubebook-ch18-web
          port: 80
          weight: 50
        - name: kubebook-ch18-api
          port: 80
          weight: 50
    - backendRefs:
        - name: kubebook-ch18-web
          port: 80
