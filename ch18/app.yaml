apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch18-NAME
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubebook-ch18-NAME
  template:
    metadata:
      labels:
        app: kubebook-ch18-NAME
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: kubebook-ch18-NAME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubebook-ch18-NAME
data:
  default.conf: |
    server {
      listen 80;
      location = /headers { return 200 "NAME: x-env=$http_x_env"; }
      location / { return 200 "NAME: $request_method $request_uri host=$host"; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch18-NAME
spec:
  selector:
    app: kubebook-ch18-NAME
  ports:
    - name: http
      port: 80
      targetPort: http
