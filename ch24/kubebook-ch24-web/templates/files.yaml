get: {{ .Files.Get "config/app.txt" }}
paths: {{ range $path, $_ := .Files.Glob "config/*" }}{{ $path }}{{ end }}
lines: {{ range .Files.Lines "config/app.txt" }}{{ . }}{{ end }}
template: {{ .Files.Get "templates/files.yaml" | len }}
data:
  {{- (.Files.Glob "config/*").AsConfig | nindent 2 }}
secret:
  {{- (.Files.Glob "config/*").AsSecrets | nindent 2 }}
