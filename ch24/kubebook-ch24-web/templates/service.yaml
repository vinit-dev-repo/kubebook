apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubebook-ch24-web.fullname" . }}
  labels:
    {{- include "kubebook-ch24-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.serviceType }}
  selector:
    {{- include "kubebook-ch24-web.selector" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
