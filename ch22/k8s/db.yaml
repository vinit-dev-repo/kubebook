apiVersion: v1
kind: ConfigMap
metadata:
  name: kubebook-ch22-db-init
data:
  schema.sql: |
    CREATE TABLE items (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(50) NOT NULL);
    INSERT INTO items (name) VALUES ('pen'), ('ink');
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubebook-ch22-db-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch22-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubebook-ch22-db
  template:
    metadata:
      labels:
        app: kubebook-ch22-db
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubebook-ch22-db-data
        - name: init
          configMap:
            name: kubebook-ch22-db-init
      containers:
        - name: mysql
          image: mysql:8.4.11
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: shop
            - name: MYSQL_USER
              value: app
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubebook-ch22-secrets
                  key: db-root-pass
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubebook-ch22-secrets
                  key: db-pass
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch22-db
spec:
  selector:
    app: kubebook-ch22-db
  ports:
    - port: 3306
      targetPort: mysql
