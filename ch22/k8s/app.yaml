apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch22-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubebook-ch22-app
  template:
    metadata:
      labels:
        app: kubebook-ch22-app
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z -w 2 kubebook-ch22-db 3306; do echo waiting for the database; sleep 2; done"]
        - name: wait-for-queue
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z -w 2 kubebook-ch22-queue 5672; do echo waiting for the queue; sleep 2; done"]
      containers:
        - name: tomcat
          image: kubebook-ch22-app:1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubebook-ch22-secrets
                  key: db-pass
            - name: QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubebook-ch22-secrets
                  key: queue-pass
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch22-app
spec:
  selector:
    app: kubebook-ch22-app
  ports:
    - port: 8080
      targetPort: http
