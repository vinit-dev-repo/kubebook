kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        - name: profiling
          value: "false"
    controllerManager:
      extraArgs:
        - name: terminated-pod-gc-threshold
          value: "100"
    scheduler:
      extraEnvs:
        - name: GOMAXPROCS
          value: "2"
    etcd:
      local:
        extraArgs:
          - name: snapshot-count
            value: "5000"
nodes:
  - role: control-plane
  - role: worker
