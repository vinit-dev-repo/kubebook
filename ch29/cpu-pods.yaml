apiVersion: v1
kind: Pod
metadata:
  name: pinned
spec:
  containers:
    - name: main
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        limits:
          cpu: "1"
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: shared
spec:
  containers:
    - name: main
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
