apiVersion: v1
kind: Pod
metadata:
  name: burstable
spec:
  containers:
    - name: main
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed
spec:
  containers:
    - name: main
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: besteffort
spec:
  containers:
    - name: main
      image: busybox:1.37
      command: ["sleep", "3600"]
