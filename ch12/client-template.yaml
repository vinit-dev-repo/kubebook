apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch12-from-NODE_SUFFIX
  namespace: kubebook-ch12-hostport
spec:
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch12-NODE_SUFFIX
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: busybox:1.37
      command: ["sleep", "3600"]
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
