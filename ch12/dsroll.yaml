apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubebook-ch12-roll
spec:
  selector:
    matchLabels:
      app: kubebook-ch12-roll
  template:
    metadata:
      labels:
        app: kubebook-ch12-roll
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: agent
          image: busybox:1.37
          command: ["sh", "-c", "echo \"agent $AGENT_VERSION\"; sleep 3600"]
          env:
            - name: AGENT_VERSION
              value: one
