apiVersion: v1
kind: ConfigMap
metadata:
  name: kubebook-ch12-scan-input
  namespace: kubebook-ch12-partitions
data:
  0.tsv: |
    atlas 12
    fern 8
  1.tsv: |
    harbor 5
    kite 17
  2.tsv: |
    lantern 9
    moss 3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubebook-ch12-page-count
  namespace: kubebook-ch12-partitions
spec:
  completions: 3
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: count
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              case "$JOB_COMPLETION_INDEX" in 0|1|2) ;; *) exit 2 ;; esac
              awk -v partition="$JOB_COMPLETION_INDEX" '
                { pages += $2; documents++ }
                END { printf "index=%s documents=%d pages=%d\n", partition, documents, pages }
              ' "/input/$JOB_COMPLETION_INDEX.tsv"
          volumeMounts:
            - name: input
              mountPath: /input
              readOnly: true
      volumes:
        - name: input
          configMap:
            name: kubebook-ch12-scan-input
