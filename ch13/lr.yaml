apiVersion: v1
kind: LimitRange
metadata:
  name: kubebook-ch13-lr
  namespace: kubebook-ch13-lr
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 128Mi
      defaultRequest:
        cpu: 250m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi
      min:
        cpu: 100m
        memory: 16Mi
