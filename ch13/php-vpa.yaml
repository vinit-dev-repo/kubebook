apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch13-php
spec:
  replicas: 2
  selector:
    matchLabels:
      app: php
  template:
    metadata:
      labels:
        app: php
    spec:
      containers:
        - name: php
          image: registry.k8s.io/hpa-example
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubebook-ch13-php
spec:
  selector:
    app: php
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch13-php2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: php2
  template:
    metadata:
      labels:
        app: php2
    spec:
      containers:
        - name: php
          image: registry.k8s.io/hpa-example
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
