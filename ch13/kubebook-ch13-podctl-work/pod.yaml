apiVersion: v1
kind: Pod
metadata: {name: budget-pair}
spec:
  resources:
    requests: {cpu: 300m, memory: 96Mi}
    limits: {cpu: 500m, memory: 128Mi}
  containers:
  - name: reader
    image: busybox:1.37
    command: [sleep, '3600']
    resources:
      requests: {cpu: 100m, memory: 32Mi}
      limits: {cpu: 200m, memory: 64Mi}
  - name: writer
    image: busybox:1.37
    command: [sleep, '3600']
    resources:
      requests: {cpu: 100m, memory: 32Mi}
      limits: {cpu: 200m, memory: 64Mi}
