apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch13-guaranteed
spec:
  containers:
    - name: web
      image: nginx:1.28-alpine
      resources:
        requests:
          cpu: 250m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch13-besteffort
spec:
  containers:
    - name: web
      image: nginx:1.28-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch13-limitonly
spec:
  containers:
    - name: web
      image: nginx:1.28-alpine
      resources:
        limits:
          cpu: 500m
          memory: 100Mi
