apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch05-attach
spec:
  restartPolicy: Never
  containers:
  - name: consumer
    image: busybox:1.37
    imagePullPolicy: Never
    stdin: true
    stdinOnce: true
    command: ["sh", "-c"]
    args:
    - |
      IFS= read -r line || exit 1
      printf '%s\n' "$line" > /work/seen
      printf 'consumer received one line\n'
    volumeMounts:
    - name: exchange
      mountPath: /work
  - name: reader
    image: busybox:1.37
    imagePullPolicy: Never
    command: ["sleep", "3600"]
    volumeMounts:
    - name: exchange
      mountPath: /work
      readOnly: true
  volumes:
  - name: exchange
    emptyDir: {}
