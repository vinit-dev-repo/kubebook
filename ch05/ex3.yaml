apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch05-ex-date
spec:
  containers:
    - name: web
      image: nginx:1.28-alpine
      volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
    - name: stamp
      image: busybox:1.37
      command: ["sh", "-c", "date > /site/index.html; sleep 3600"]
      volumeMounts:
        - name: site
          mountPath: /site
  volumes:
    - name: site
      emptyDir: {}
