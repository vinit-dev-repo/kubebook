apiVersion: v1
kind: Pod
metadata:
  name: $name
  namespace: default
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: busybox:1.37
      command: ["sleep", "3600"]
  hostAliases:
    - ip: "$target"
      hostnames: ["migration-preview.default.svc.cluster.local"]
