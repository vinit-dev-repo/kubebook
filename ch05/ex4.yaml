apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch05-ex-init
spec:
  initContainers:
    - name: one
      image: busybox:1.37
      command: ["sh", "-c", "echo one; sleep 1"]
    - name: two
      image: busybox:1.37
      command: ["sh", "-c", "echo two; sleep 1"]
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
