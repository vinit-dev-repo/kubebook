apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch05-sidecar
spec:
  initContainers:
    - name: shipper
      image: busybox:1.37
      restartPolicy: Always
      command: ["sh", "-c", "while true; do if [ -f /logs/app.log ]; then tail -n1 /logs/app.log; fi; sleep 2; done"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"line $i\" >> /logs/app.log; sleep 1; done"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  volumes:
    - name: logs
      emptyDir: {}
