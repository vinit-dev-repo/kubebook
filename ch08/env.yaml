apiVersion: v1
kind: Pod
metadata:
  name: kubebook-ch08-env
spec:
  restartPolicy: Never
  containers:
    - name: box
      image: busybox:1.37
      command: ["sh", "-c", "env | grep -E '^(GREETING|WHO|MESSAGE|MY_POD_NAME|MY_NAMESPACE|MY_NODE|MY_CPU_LIMIT|MY_CPU_MILLI|MY_MEM_REQUEST)=' | sort"]
      resources:
        requests:
          memory: 32Mi
        limits:
          cpu: 500m
      env:
        - name: GREETING
          value: hello
        - name: WHO
          value: world
        - name: MESSAGE
          value: "$(GREETING), $(WHO)"
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MY_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MY_CPU_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
        - name: MY_CPU_MILLI
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: 1m
        - name: MY_MEM_REQUEST
          valueFrom:
            resourceFieldRef:
              resource: requests.memory
              divisor: 1Mi
