apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebook-ch08-consumer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubebook-ch08-consumer
  template:
    metadata:
      labels:
        app: kubebook-ch08-consumer
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 1
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubebook-ch08-consumer
