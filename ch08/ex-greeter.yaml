apiVersion: v1
kind: Pod
metadata:
  name: greeter
  namespace: kubebook-ch08-ex
spec:
  restartPolicy: Never
  containers:
    - name: box
      image: busybox:1.37
      command: ["sh", "-c", "echo $GREETING"]
      env:
        - name: GREETING
          valueFrom:
            configMapKeyRef:
              name: shop-greet
              key: greeting
