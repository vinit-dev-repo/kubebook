apiVersion: v1
kind: Namespace
metadata:
  name: kubebook-ch19-shop
  labels:
    team: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubebook-ch19-ops
  labels:
    team: ops
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: kubebook-ch19-shop
  labels:
    app: web
spec:
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch19-worker
  terminationGracePeriodSeconds: 1
  containers:
    - name: web
      image: nginx:1.28-alpine
      ports:
        - name: http
          containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kubebook-ch19-shop
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: kubebook-ch19-shop
  labels:
    app: api
spec:
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch19-worker
  terminationGracePeriodSeconds: 1
  containers:
    - name: api
      image: nginx:1.28-alpine
      ports:
        - name: http
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kubebook-ch19-shop
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: http
