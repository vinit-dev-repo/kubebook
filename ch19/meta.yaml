apiVersion: v1
kind: Namespace
metadata:
  name: kubebook-ch19-meta
---
apiVersion: v1
kind: Pod
metadata:
  name: fake-metadata
  namespace: kubebook-ch19-meta
spec:
  hostNetwork: true
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch19-worker
  terminationGracePeriodSeconds: 1
  containers:
    - name: httpd
      image: busybox:1.37
      command: ["sh", "-c", "mkdir -p /www/latest && echo role-credentials-of-the-node > /www/latest/credentials && httpd -f -p 169.254.169.254:80 -h /www"]
---
apiVersion: v1
kind: Pod
metadata:
  name: site
  namespace: kubebook-ch19-meta
  labels:
    app: site
spec:
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch19-worker2
  terminationGracePeriodSeconds: 1
  containers:
    - name: httpd
      image: busybox:1.37
      command: ["sh", "-c", "mkdir -p /www && echo the-site-page > /www/index.html && httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: kubebook-ch19-meta
spec:
  selector:
    app: site
  ports:
    - port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: kubebook-ch19-meta
  labels:
    app: client
spec:
  nodeSelector:
    kubernetes.io/hostname: kubebook-ch19-worker
  terminationGracePeriodSeconds: 1
  containers:
    - name: client
      image: busybox:1.37
      command: ["sleep", "3600"]
