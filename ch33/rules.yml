groups:
  - name: kubebook-object-state
    interval: 1m
    rules:
      - alert: KubebookPodUnready
        expr: max by (namespace, pod) (kube_pod_status_ready{namespace="kubebook-ch33", condition="false"}) == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Pod {{ $labels.pod }} has stayed unready.'
